# Dependabot version updates (https://docs.github.com/code-security/dependabot).
#
# This is the continuous, automatic half of dependency hygiene: Dependabot opens PRs to bump
# dependencies on a schedule and — once "Dependabot security updates" is enabled in the repo's
# Settings → Advanced Security — raises fix PRs for advisories between the daily cargo-audit runs.
# It complements .github/workflows/audit.yml, which is the hard gate that fails a build on a
# vulnerability.
version: 2
updates:
  # The Cargo workspace: opamp, server, and client share one lockfile at the root.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # One PR per week for the routine patch/minor bumps, so the noise stays low; a major bump
      # still gets its own PR to be reviewed on its own.
      cargo-patch-minor:
        update-types:
          - "minor"
          - "patch"

  # The Actions the CI and release workflows pin (checkout, rust-cache, install-action, …).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
