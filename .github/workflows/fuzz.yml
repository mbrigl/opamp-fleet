name: Fuzz

# Runs every fuzz target under fuzz/ (specification Q-2): the parsers that read bytes from the
# network or from a downloaded artifact. A pull request gets a short run of each, enough to catch
# a regression on the seeds and what they lead to; the schedule runs longer and keeps searching.
# libFuzzer needs a nightly compiler, which only this workflow installs; the workspace itself stays
# on the pinned stable toolchain.
on:
  pull_request:
    paths:
      - "crates/**"
      - "fuzz/**"
      - "Cargo.lock"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "41 3 * * *" # Daily, 03:41 UTC.

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [frame_decode, body_decode, client_receive, pem, csr_sign, archive_tree]
    env:
      SECONDS_PER_TARGET: ${{ github.event_name == 'schedule' && '900' || '60' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz ${{ matrix.target }}
        run: |
          mkdir -p "fuzz/corpus/${{ matrix.target }}"
          cargo +nightly fuzz run "${{ matrix.target }}" \
            "fuzz/corpus/${{ matrix.target }}" "fuzz/seeds/${{ matrix.target }}" \
            -- -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048
      # A crash leaves its input under fuzz/artifacts/; keep it, so the failure can be replayed.
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
