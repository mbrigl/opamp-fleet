name: Service smoke

# The one thing every other test stands in for: the machine's *real* service manager (ADR-0019,
# ADR-0018). `crates/fleet-agent/tests/service_smoke.rs` installs the Client as a system service, starts
# it, kills its process, and asserts the manager brings it back — the restart a self-update depends
# on and that no in-process stand-in can prove.
#
# Deliberately not on `push` or `pull_request`. It registers a system service, needs elevation, and
# waits on timers; a merge must not hang on it, and a flake must not read as a broken change.

on:
  workflow_dispatch:
  schedule:
    # Weekly on Saturday, well outside working hours in CET.
    - cron: "0 3 * * 6"

permissions:
  contents: read

jobs:
  smoke:
    name: service smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Generous: the test waits out the restart delay several times over, and a hang should fail as
    # a timeout rather than burn a runner hour.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows: `service-manager`'s `sc.exe` backend discards the restart policy, so the Client
        # registers the SCM's recovery actions itself and reports `ServiceSpecific(10)` on exit so
        # a self-update's exit reads as a failure rather than a clean stop. None of that is
        # asserted anywhere else. And the process account (ADR-0037): under the Client's and the
        # second service's virtual accounts, a Managed Process runs through the second service's
        # named pipe without SeImpersonatePrivilege, cannot read the Client's key or write its
        # program, reads its config and writes its data, and runs again after the SCM restarts
        # the second service.
        # Linux: the unit the Client writes itself (ADR-0037) — a re-registration keeps its
        # account, the service keeps the privileges `sudo` and setuid helpers need, and systemd
        # accepts the unit. And the process account (ADR-0037): with two real accounts, a Managed
        # Process runs under the process account through the second service, cannot read the
        # Client's key or write its program, reads its config and writes its data, runs again after
        # the second service restarts, keeps its data across a re-registration as a package upgrade
        # makes one, and runs under the Client's account once the process account is dropped. The
        # run step needs `sudo -E` there, which the Windows runner does not (its shell is already
        # elevated).
        # macOS: the same for launchd — both plists from `service-manager`, the second service's
        # with the process account in `UserName`, and two role accounts made with `dseditgroup`
        # and `sysadminctl -roleAccount` as the refusal of a missing process account says. The
        # runner's `sudo` asks no password, as on Linux.
        # Every platform: the install a script runs after the package (ADR-0022 clause 19) enrols
        # with a `bootstrap.p12` and its password file from `--fleet-files`, against a Server in
        # the test, and the service it registers reaches that Server on the issued certificate; a
        # wrong password fails the install before anything is written.
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The test built first, so that a compile failure does not read as a smoke-test failure;
      # then, as root through sudo on Linux and macOS, the service run, and on Linux the two tests
      # of the links root places (ADR-0037 clauses 20 and 21), which the unprivileged run in CI
      # covers for every other account. Git Bash on Windows, whose runner shell is elevated.
      - name: Install, start, kill, restart, stop, uninstall; the account, the privileges, and the process account
        shell: bash
        run: bash scripts/check-service-smoke.sh
