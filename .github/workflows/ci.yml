name: CI

# What the Definition of Done (AGENTS.md §5) asks beyond Linux, on the stack of ADR-0009: the
# Client checked and tested on Windows and macOS, and release builds of the Client on every
# platform it ships on — Linux, Windows, and macOS — and of the Server on Linux only
# (docs/SPECIFICATION.md). Build, test and lint on Linux are the 'rust' job of checks.yml, which
# runs scripts/check-rust.sh as the local gate does. The commands MUST match README.md →
# "Build, Test & Run", the single source of truth.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ADR-0021: the client carries platform-specific service paths (the Windows SCM shim, launchd
  # semantics) that a Linux-only lint never compiles. Keep them honest: clippy and tests on the
  # real platforms. Actual service registration still needs the manual smoke checklist
  # (README.md → "Running as an OS service") — CI runners cannot exercise systemd/launchd/SCM.
  client-platform-check:
    name: client checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p fleet-agent --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test -p fleet-agent --locked

  # The Client ships on Linux, macOS, and Windows; the Server on Linux only.
  release-build:
    name: release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: client-linux, os: ubuntu-latest, package: fleet-agent, binary: target/release/supervisor }
          - { name: client-windows, os: windows-latest, package: fleet-agent, binary: target/release/supervisor.exe }
          - { name: client-macos, os: macos-latest, package: fleet-agent, binary: target/release/supervisor }
          - { name: server-linux, os: ubuntu-latest, package: fleet-server, binary: target/release/server }
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: cargo build -p ${{ matrix.package }} --release --locked
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
