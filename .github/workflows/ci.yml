name: CI

# Release builds of the Client on every platform it ships on — Linux, Windows, and macOS — and of
# the Server on Linux only (docs/SPECIFICATION.md), on the stack of ADR-0008. The Client checked
# and tested on Windows and macOS, and the stores' tests against a real store, are jobs of
# checks.yml, required checks like the rest of it. The commands MUST match README.md →
# "Build, Test & Run", the single source of truth.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The Client ships on Linux, macOS, and Windows; the Server on Linux only.
  release-build:
    name: release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: client-linux, os: ubuntu-latest, package: fleet-agent, binary: target/release/supervisor }
          - { name: client-windows, os: windows-latest, package: fleet-agent, binary: target/release/supervisor.exe }
          - { name: client-macos, os: macos-latest, package: fleet-agent, binary: target/release/supervisor }
          - { name: server-linux, os: ubuntu-latest, package: fleet-server, binary: target/release/server }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Git Bash on Windows: the runner's default shell is PowerShell, where 'bash' may name WSL's.
      - name: Build (release)
        shell: bash
        run: bash scripts/check-release-build.sh ${{ matrix.package }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
