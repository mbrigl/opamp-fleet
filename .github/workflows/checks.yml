name: Checks

# Enforces the repository's rules as CI. Pure bash + coreutils — nothing is installed but the Rust
# toolchain of the Rust jobs and the stores the two store jobs start (ShellCheck, used by the shell
# job, ships preinstalled on the GitHub-hosted runner image).
# scripts/check-all.sh is the local equivalent; check 9 of scripts/check-docs.sh holds its list,
# the jobs of this workflow, and the required checks named in README.md together. A job runs each
# check after its self-test where it has one, and each script's header says what it checks and
# which ADR it holds, or that the check is the rule.
#
# The sensors report for the reviewer and fail on nothing they count, except the action
# references once a project runs that sensor with --require; their self-tests fail like any
# check's. The sensors job checks out the full history because three sensors read it. The review
# binding sensor runs in review-binding.yml, the repository settings sensor on a human's
# instruction (ADR-0002); this workflow runs the self-test of each.
#
# The actions job holds the supply chain: every third-party action pinned to a commit SHA whose
# release tag still points to it, every first-party action on its major tag, Dependabot raising
# both (ADR-0010), checked by scripts/check-action-refs.sh --resolve, which reads the tags with git
# ls-remote; and scripts/check-build-hardening.sh: no checkout keeps the token, the release is gated
# on advisories and built uncached with pinned tools, and the compiler, the release profile's
# overflow checks and the crates that forbid unsafe code are as that script lists. It also runs
# scripts/check-fuzz-targets.sh: the fuzz matrix, fuzz/Cargo.toml and fuzz/seeds/ name one set.
#
# The rust job builds, tests, and lints the Cargo workspace with scripts/check-rust.sh, the commands
# of README.md → "Build, Test & Run" on the stack of ADR-0008, the same script scripts/check-all.sh
# runs, so the build and the tests gate a push as they gate a merge. rustup reads
# rust-toolchain.toml on first use, and the cache keeps the build within its timeout. The four
# jobs after it check the Client on Windows and macOS and the stores against a real S3 and
# PostgreSQL, with scripts check-all.sh runs too: locally each says so and skips where the machine
# has no such platform or no store is named. As jobs of this workflow they also run on its
# schedule, by hand, and when a draft is marked ready.
#
# Every job is bounded by a timeout — a hung step would otherwise occupy a runner until the
# platform's own six-hour limit — and every checkout runs with 'persist-credentials: false': the
# workflow token is needed to fetch the code, not afterwards, and leaving it in .git/config makes
# it readable to every later step and to anything they invoke.

on:
  pull_request:
    # ready_for_review runs check 16 of check-docs.sh again on a draft pull request marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Started by hand on a pushed branch that has no pull request yet, such as a feat/ branch
  # under rework (AGENTS.md, section 6): gh workflow run checks.yml --ref <branch>. GitHub offers
  # it only once this trigger is on the default branch.
  workflow_dispatch:
  # Once a week against main without a change: catches what moves without a commit, the runner
  # image, a retagged action, a toolchain download. GitHub disables a schedule after 60 days
  # without activity in a public repository.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

# Cancel a pull request's superseded runs: a new push makes the previous run's verdict irrelevant,
# while a queued run keeps a required check pending. Runs on 'main' are never cancelled — every
# commit there keeps a result of its own, and the event name keeps a scheduled run out of the group
# of the pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Submodules are checked out because the link check resolves relative targets against the
      # working tree: a documentation link into a submodule would otherwise break in CI while
      # working locally. Their *contents* are never read — check-docs.sh enumerates via
      # `git ls-files`, which lists a submodule as one gitlink entry, not as its files.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      # The check's own tests run first: a check that is wrong passes nothing worth trusting.
      - name: Self-test the documentation checks
        run: bash scripts/test-check-docs.sh
      - name: Self-test the Protocol Baseline check
        run: bash scripts/test-check-protocol-baseline.sh
      # Check 16 reads the branch the change lands on from GitHub's own variables: a draft ADR
      # fails on a pull request into main once it is ready for review, and on a push to main
      # (ADR-0002). A draft pull request tests a feat/ branch still under rework, and passes.
      - name: Check documentation consistency
        run: bash scripts/check-docs.sh
        env:
          PULL_REQUEST_DRAFT: ${{ github.event.pull_request.draft }}
      # A newer upstream release is a warning, never a failure (ADR-0011).
      - name: Check the Protocol Baseline
        run: bash scripts/check-protocol-baseline.sh
      - name: Self-test the manual check
        run: bash scripts/test-check-manual.sh
      - name: Check that the manual cites no ADR
        run: bash scripts/check-manual.sh
      - name: Self-test the map script of the normalize skill
        run: bash scripts/test-normalize-remap.sh
      - name: Self-test the numbering script of the drafts
        run: bash scripts/test-number-adrs.sh
      - name: Self-test the readiness script of the pull request into main
        run: bash scripts/test-ready-for-main.sh
      - name: Self-test the drop script of a merged branch
        run: bash scripts/test-drop-merged-branch.sh

  traceability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The check's own tests run first: a check that is wrong passes nothing worth trusting.
      - name: Self-test the traceability check
        run: bash scripts/test-check-traceability.sh
      - name: Check that accepted decisions and criteria are verified by tests
        run: bash scripts/check-traceability.sh

  devcontainer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The check's own tests run first: a check that is wrong passes nothing worth trusting.
      - name: Self-test the Dev Container check
        run: bash scripts/test-check-devcontainer.sh
      - name: Check that the Dev Container keeps the host engine out of reach
        run: bash scripts/check-devcontainer.sh

  actions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The check's own tests run first: a check that is wrong passes nothing worth trusting.
      - name: Self-test the action reference check
        run: bash scripts/test-check-action-refs.sh
      - name: Check that third-party actions are pinned to a commit SHA, first-party ones to their major tag, and Dependabot covers them
        run: bash scripts/check-action-refs.sh --resolve
      - name: Self-test the build hardening check
        run: bash scripts/test-check-build-hardening.sh
      - name: Check that checkouts keep no token and the release is gated, uncached and pinned
        run: bash scripts/check-build-hardening.sh
      - name: Self-test the fuzz target check
        run: bash scripts/test-check-fuzz-targets.sh
      - name: Check that fuzz/Cargo.toml, the fuzz matrix and the seeds name the same targets
        run: bash scripts/check-fuzz-targets.sh

  sensors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # The sensor's own tests run first: a sensor that is wrong reports nothing worth reading.
      - name: Self-test the tests-kept sensor
        run: bash scripts/test-sensor-tests-kept.sh
      # The base is the pull request's base branch, or the previous tip on a push to main. A
      # forced push leaves that tip out of the history the checkout fetches, so it passes none.
      - name: Report test files deleted and skip markers added since the base
        run: bash scripts/sensor-tests-kept.sh "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || (!github.event.forced && github.event.before) || '' }}
      - name: Self-test the binding ADRs sensor
        run: bash scripts/test-sensor-binding-adrs.sh
      - name: Report the ADRs in force whose Applies to names a path the change touches
        run: bash scripts/sensor-binding-adrs.sh "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || (!github.event.forced && github.event.before) || '' }}
      - name: Self-test the revision-due sensor
        run: bash scripts/test-sensor-revision-due.sh
      - name: Report the changes since the last design revision
        run: bash scripts/sensor-revision-due.sh
      - name: Self-test the plan frontier sensor
        run: bash scripts/test-sensor-plan-frontier.sh
      - name: Report the tickets that may be claimed, the claimed, and the blocked
        run: bash scripts/sensor-plan-frontier.sh
      - name: Self-test the action references sensor
        run: bash scripts/test-sensor-action-refs.sh
      - name: Report the forms of the action references the workflows use
        run: bash scripts/sensor-action-refs.sh
      - name: Self-test the review binding sensor
        run: bash scripts/test-sensor-review-binding.sh
      # The repository settings sensor itself runs on a human's instruction (ADR-0002).
      - name: Self-test the repository settings sensor
        run: bash scripts/test-sensor-repo-settings.sh

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Self-test the check runner
        run: bash scripts/test-check-all.sh
      - name: Self-test the git hooks
        run: bash scripts/test-git-hooks.sh
      - name: The self-tests' fixtures leave an inherited repository alone
        run: bash scripts/test-fixture-isolation.sh
      - name: Self-test the shell lint
        run: bash scripts/test-check-shell.sh
      - name: Lint shell scripts with ShellCheck
        run: bash scripts/check-shell.sh

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # rustup honours rust-toolchain.toml (the pinned release + rustfmt + clippy) on first use.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build, test and lint the workspace
        run: bash scripts/check-rust.sh

  # ADR-0019: the client carries platform-specific service paths (the Windows SCM shim, launchd
  # semantics) that a Linux-only lint never compiles. Keep them honest: clippy and tests on the
  # real platforms. Actual service registration still needs the manual smoke checklist
  # (README.md → "The service smoke test") — CI runners cannot exercise systemd/launchd/SCM.
  #
  # Both are required status checks (README.md → "Repository settings"), like every job of this
  # workflow, so these two are plain jobs without a 'name:' or a matrix: a ruleset names a check
  # by the job's rendered name, and the job id is what scripts/check-docs.sh compares with the
  # README.
  # fleet-tools too: the release packs every Client archive with `opamp-fleetctl`, Windows
  # included, and publishes it for macOS (ADR-0032).
  client-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Git Bash: the runner's default shell is PowerShell, where 'bash' may name WSL's.
      - name: Clippy and test
        shell: bash
        run: bash scripts/check-client-platform.sh

  client-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy and test
        run: bash scripts/check-client-platform.sh

  # ADR-0029 clause 20: the S3 store's tests, which a plain `cargo test` skips, run here against a
  # rustfs service, its image pinned by digest. The key pair is the throwaway one of this job's
  # own container, not a secret. The tests make a prefix of their own and leave the bucket empty.
  s3-store:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      rustfs:
        image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
        env:
          RUSTFS_ACCESS_KEY: fleet-ci
          RUSTFS_SECRET_KEY: fleet-ci-secret
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Create the bucket
        # The Server creates none (ADR-0029 clause 16). curl signs the request itself; the service
        # may still be starting, so the first attempts are allowed to fail.
        run: |
          empty="$(printf '' | sha256sum | cut -d' ' -f1)"
          for _ in $(seq 1 30); do
            if curl -fsS --aws-sigv4 aws:amz:us-east-1:s3 --user fleet-ci:fleet-ci-secret \
                -H "x-amz-content-sha256: $empty" -X PUT http://127.0.0.1:9000/fleet; then
              exit 0
            fi
            sleep 2
          done
          echo "rustfs did not create the bucket" >&2
          exit 1
      - name: Write the secret key file
        run: (umask 077 && printf '%s' fleet-ci-secret > "$RUNNER_TEMP/s3-secret")
      # Skipped is not passed: the store is named, so every S3 test must reach it.
      - name: Test against rustfs
        env:
          FLEET_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          FLEET_TEST_S3_BUCKET: fleet
          FLEET_TEST_S3_ACCESS_KEY_ID: fleet-ci
          FLEET_TEST_S3_SECRET_ACCESS_KEY_FILE: ${{ runner.temp }}/s3-secret
        run: bash scripts/check-store.sh s3

  postgres-store:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Start PostgreSQL with TLS
        # The connection the Server makes: TLS 1.3, the database's certificate verified against
        # the CA made here and its name checked (ADR-0029 clause 24). Started by `docker run`
        # rather than as a service, so that it starts after its certificate is made.
        run: |
          set -euo pipefail
          certs="$RUNNER_TEMP/postgres-tls"
          mkdir -p "$certs"
          cd "$certs"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 2 \
            -subj "/CN=fleet CI database CA" -keyout ca.key -out ca.pem
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -subj "/CN=localhost" -keyout server.key -out server.csr
          printf 'subjectAltName=IP:127.0.0.1,DNS:localhost\nextendedKeyUsage=serverAuth\n' > ext.cnf
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 \
            -extfile ext.cnf -out server.pem
          # PostgreSQL reads its key only when the server's account owns it, alone.
          sudo chown 999:999 server.key server.pem
          sudo chmod 600 server.key
          docker run -d --name postgres -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=fleet -e POSTGRES_PASSWORD=fleet-ci -e POSTGRES_DB=fleet \
            -v "$certs/server.pem:/tls/server.pem:ro" -v "$certs/server.key:/tls/server.key:ro" \
            postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6 \
            -c ssl=on -c ssl_cert_file=/tls/server.pem -c ssl_key_file=/tls/server.key \
            -c ssl_min_protocol_version=TLSv1.3
          for _ in $(seq 1 60); do
            if docker exec postgres pg_isready --host 127.0.0.1 --username fleet --dbname fleet; then
              exit 0
            fi
            sleep 2
          done
          docker logs postgres >&2
          exit 1
      - name: Write the password file
        run: (umask 077 && printf '%s' fleet-ci > "$RUNNER_TEMP/postgres-password")
      - name: Test against PostgreSQL
        # Over TLS against the CA above; each test works in a schema of its own
        # (ADR-0029 clause 25). Skipped is not passed: the database is named, so every PostgreSQL
        # test must reach it.
        env:
          FLEET_TEST_POSTGRES_HOST: 127.0.0.1
          FLEET_TEST_POSTGRES_PORT: "5432"
          FLEET_TEST_POSTGRES_DBNAME: fleet
          FLEET_TEST_POSTGRES_USER: fleet
          FLEET_TEST_POSTGRES_PASSWORD_FILE: ${{ runner.temp }}/postgres-password
          FLEET_TEST_POSTGRES_CA_FILE: ${{ runner.temp }}/postgres-tls/ca.pem
        run: bash scripts/check-store.sh postgres
