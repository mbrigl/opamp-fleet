name: Checks

# Enforces the repository's rules as CI. Pure bash + coreutils — nothing is installed
# (ShellCheck, used by the shell job, ships preinstalled on the GitHub-hosted runner image).
# scripts/check-all.sh runs the same checks in the same order locally (AGENTS.md §5); a check
# added here is added there in the same change. Check 9 of scripts/check-docs.sh
# verifies that the two lists, and the required checks named in README.md, still agree.
# - Documentation: the consistency checks that scripts/check-docs.sh runs, after its own self-test
#   has passed. Its header lists them and is the single place they are described — this file does
#   not restate the list.
# - Traceability: every accepted ADR is cited by a test and every citation names something that
#   exists (ADR-0003), checked by scripts/check-traceability.sh after its own self-test has passed.
# - Dev Container: no host Docker socket, Features pinned and locked, the container-management
#   extension on the host side (ADR-0002), checked by scripts/check-devcontainer.sh after its own
#   self-test has passed.
# - Action references: every action a workflow uses is referenced by its major version tag and
#   Dependabot is configured to raise the major bump (ADR-0007), checked by
#   scripts/check-action-refs.sh after its own self-test has passed.
# - Sensors: what weakens the test suite and no toolchain's tools notice — test files deleted
#   and skip markers added since the pull request's base — reported by
#   scripts/sensor-tests-kept.sh for the reviewer (AGENTS.md, section 5), and the changes since
#   the last design revision, reported by scripts/sensor-revision-due.sh (ADR-0004), each after
#   its self-test has passed. The job reports and never fails on what it counts; the reason for
#   a finding is in the pull request, and a due revision is the human's to schedule. It checks
#   out the full history because both sensors read it.
# - Shell lint: every shell script passes ShellCheck — the scripts are this repository's
#   enforcement layer, so they are linted themselves. The job first runs the self-test of the
#   git hooks under .githooks/, which refuse a commit on main and a push while the checks are
#   red: a hook that is wrong guards nothing.
# - Build, test, lint: absent until the project has a toolchain (the base image ships none; adding
#   one is architecture-relevant and recorded as an ADR first, AGENTS.md §3). Then one more job
#   here: a step that sets up the toolchain, then 'run: bash scripts/<the script the toolchain ADR
#   names>' — the same script scripts/check-all.sh runs — with a timeout that fits the real build,
#   'submodules: recursive' on the checkout if the project uses submodules, and its name among the
#   required checks in README.md — the one job of this workflow that installs something. Check 9
#   recognises the job by that run line and fails a job whose commands are written inline
#   instead: those would run here and never in the local gate.
#
# Every job is bounded by a timeout — a hung step would otherwise occupy a runner until the
# platform's own six-hour limit — and every checkout runs with 'persist-credentials: false': the
# workflow token is needed to fetch the code, not afterwards, and leaving it in .git/config makes
# it readable to every later step and to anything they invoke.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel a pull request's superseded runs: a new push makes the previous run's verdict irrelevant,
# while a queued run keeps a required check pending. Runs on 'main' are never cancelled — every
# commit there keeps a result of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Submodules are checked out because the link check resolves relative targets against the
      # working tree: a documentation link into a submodule would otherwise break in CI while
      # working locally. Their *contents* are never read — check-docs.sh enumerates via
      # `git ls-files`, which lists a submodule as one gitlink entry, not as its files.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      # The check's own tests run first: a check that is wrong passes nothing worth trusting.
      - name: Self-test the documentation checks
        run: bash scripts/test-check-docs.sh
      - name: Check documentation consistency
        run: bash scripts/check-docs.sh

  traceability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The check's own tests run first: a check that is wrong passes nothing worth trusting.
      - name: Self-test the traceability check
        run: bash scripts/test-check-traceability.sh
      - name: Check that accepted decisions and criteria are verified by tests
        run: bash scripts/check-traceability.sh

  devcontainer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The check's own tests run first: a check that is wrong passes nothing worth trusting.
      - name: Self-test the Dev Container check
        run: bash scripts/test-check-devcontainer.sh
      - name: Check that the Dev Container keeps the host engine out of reach
        run: bash scripts/check-devcontainer.sh

  actions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The check's own tests run first: a check that is wrong passes nothing worth trusting.
      - name: Self-test the action reference check
        run: bash scripts/test-check-action-refs.sh
      - name: Check that actions are referenced by major version tag and Dependabot covers them
        run: bash scripts/check-action-refs.sh

  sensors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # The sensor's own tests run first: a sensor that is wrong reports nothing worth reading.
      - name: Self-test the tests-kept sensor
        run: bash scripts/test-sensor-tests-kept.sh
      # The base is the pull request's base branch, or the previous tip on a push to main.
      - name: Report test files deleted and skip markers added since the base
        run: bash scripts/sensor-tests-kept.sh "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Self-test the revision-due sensor
        run: bash scripts/test-sensor-revision-due.sh
      - name: Report the changes since the last design revision
        run: bash scripts/sensor-revision-due.sh

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Self-test the git hooks
        run: bash scripts/test-git-hooks.sh
      - name: Lint shell scripts with ShellCheck
        run: bash scripts/check-shell.sh
