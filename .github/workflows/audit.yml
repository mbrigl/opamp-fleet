name: Security audit

# Runs `cargo audit` (README → "Build, Test & Run") against the locked dependency graph. It fails on
# any vulnerability; reviewed, non-actionable warnings are recorded in `.cargo/audit.toml`.
#
# Two kinds of trigger, because two kinds of thing change: the dependency graph (a Cargo.toml/lock
# edit) and the advisory database itself. The schedule is what catches a newly disclosed advisory in
# a dependency nobody has touched — the whole reason an audit is worth running on a clock.
on:
  push:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".cargo/audit.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".cargo/audit.toml"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
