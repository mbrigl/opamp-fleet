[package]
name = "fleet-util"
description = "What the OpAMP Fleet Client and the operator tool share and the Server does not use (ADR-0008)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Only `fleet-core` of the workspace: the Server never links this crate, and the Client and the
# operator tool both do (ADR-0008 clause 16).
[dependencies]
# `identity::pkcs12::open` opens a bootstrap PKCS#12 file through `fleet_core::pkcs12::file`
# (ADR-0027).
fleet-core.workspace = true
# The unpackers of a package's artifact: `.tar.gz`, `.7z` (an encrypted one with the key from
# `[packages] archive_key`) and `.zip` (ADR-0033).
flate2.workspace = true
tar.workspace = true
sevenz-rust2.workspace = true
zip.workspace = true
tracing.workspace = true
# A PEM block written from DER, in a buffer wiped on drop (ADR-0015).
base64.workspace = true
zeroize.workspace = true

# The file operations that follow no link go through the `*at` system calls on Unix
# (ADR-0022).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile = "3"
# The tests read the workspace's manifests and, as a syntax tree, its sources (ADR-0008 clause 16).
toml.workspace = true
syn.workspace = true
quote.workspace = true
proc-macro2.workspace = true
# The PKCS#12 reader's test seals a bootstrap file from a key and a certificate it makes.
rcgen.workspace = true
# Tests build the `.7z` fixtures they then open; the Client itself only ever decompresses.
sevenz-rust2 = { workspace = true, features = ["compress"] }
