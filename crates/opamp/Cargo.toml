[package]
name = "opamp"
description = "Shared OpAMP wire layer: generated protobuf types and WebSocket framing (ADR-0006)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
prost.workspace = true
uuid.workspace = true
# ADR-0044: the endpoint's gzip MUST and the PEM readers, each written once for both ends. All
# three are already workspace dependencies of both binaries, so nothing new is linked into either.
flate2.workspace = true
rustls.workspace = true

[dev-dependencies]
# Generating a certificate and key for the PEM tests, rather than pasting a fixture that expires.
rcgen.workspace = true

[build-dependencies]
prost-build.workspace = true
protox.workspace = true
# Resolving the baked version from the repository's tags (ADR-0009). A build dependency only: it is
# linked into no artifact, and it sits here rather than in each binary so that both ends report a
# version computed by one implementation.
git2.workspace = true
