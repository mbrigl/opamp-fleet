[package]
name = "fleet-core"
description = "What the Server and the Client of OpAMP Fleet implement identically, beyond the protocol (ADR-0008)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
# Resolving the baked version from the repository's tags (ADR-0033). A build dependency only: it is
# linked into no artifact, and it sits here rather than in each binary so that both ends report a
# version computed by one implementation.
git2.workspace = true

[dependencies]
# The bootstrap certificate as a password-protected PKCS#12 file, written by the Server and read by
# the Client (ADR-0022): `pkcs12`, `pkcs5` and `der` read which schemes a file uses; `rcgen` and
# `x509-parser` tell whether the key and the certificate belong together.
p12-keystore.workspace = true
pkcs12.workspace = true
pkcs5.workspace = true
der.workspace = true
rcgen.workspace = true
x509-parser = { workspace = true, features = ["verify"] }
# The host a certificate that names none is taken for, on the Server and on a Gateway alike
# (ADR-0015): the SHA-256 of its issuer and serial.
sha2.workspace = true
hex.workspace = true
# A client certificate as the Server and a Gateway read it, and the serial and start every
# certificate this project makes gets (`x509`): `verify` checks a CA's signature, `ring` draws the
# serial and `time` is the date type rcgen speaks and a certificate's end is read in
# (`ending::read`) — all three already linked by both ends.
ring.workspace = true
time.workspace = true
# A proof a certificate signing request carries is base64url in a requested SAN URI (ADR-0015),
# read the same way on the Server and on a Gateway.
base64.workspace = true
# The key a `bootstrap.p12` opens to is held in a buffer wiped on drop (ADR-0014). No TLS or
# crypto backend comes with zeroize itself (ADR-0012).
zeroize.workspace = true

[dev-dependencies]
# A CA's files written for the test that loads them.
tempfile = "3"
