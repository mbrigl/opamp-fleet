[package]
name = "fleet-core"
description = "What the Server and the Client of OpAMP Fleet implement identically, beyond the protocol (ADR-0040)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
# Resolving the baked version from the repository's tags (ADR-0037). A build dependency only: it is
# linked into no artifact, and it sits here rather than in each binary so that both ends report a
# version computed by one implementation.
git2.workspace = true

[dependencies]
# The bootstrap certificate as a password-protected PKCS#12 file, written by the Server and read by
# the Client (ADR-0027): `pkcs12`, `pkcs5` and `der` read which schemes a file uses; `rcgen` and
# `x509-parser` tell whether the key and the certificate belong together. `x509-parser` also reads a
# certificate's end for `pki status` and the running Server (`ending::read`).
p12-keystore.workspace = true
pkcs12.workspace = true
pkcs5.workspace = true
der.workspace = true
rcgen.workspace = true
x509-parser = { workspace = true, features = ["verify"] }
# The host a certificate that names none is taken for, on the Server and on a Gateway alike
# (ADR-0016): the SHA-256 of its issuer and serial.
sha2.workspace = true
hex.workspace = true
# A client certificate as the Server and a Gateway read it, and the serial and start every
# certificate this project makes gets (`x509`): `verify` checks a CA's signature, `ring` draws the
# serial and `time` is the date type rcgen speaks, which `ending::read` gives a certificate's end
# in — all three already linked by both ends.
ring.workspace = true
time.workspace = true
# The key a `bootstrap.p12` opens to is held in a buffer wiped on drop (ADR-0014). No TLS or
# crypto backend comes with zeroize itself (ADR-0012).
zeroize.workspace = true
# What the Server and the operator program do alike on a PKCS#11 token (ADR-0026, ADR-0036 clause
# 5), behind the `pkcs11` feature: only those two turn it on, so the Client does not build it.
cryptoki = { workspace = true, optional = true }

[features]
pkcs11 = ["dep:cryptoki"]

[dev-dependencies]
# A CA's files written for the test that loads them.
tempfile = "3"
