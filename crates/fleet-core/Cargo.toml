[package]
name = "fleet-core"
description = "What the Server and the Client of OpAMP Fleet implement identically, beyond the protocol (ADR-0011, ADR-0031)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The PEM readers both ends use; both already link rustls (ADR-0011).
rustls.workspace = true

[dev-dependencies]
# Generating a certificate and key for the PEM tests, rather than pasting a fixture that expires.
rcgen.workspace = true

[build-dependencies]
# Resolving the baked version from the repository's tags (ADR-0013). A build dependency only: it is
# linked into no artifact, and it sits here rather than in each binary so that both ends report a
# version computed by one implementation.
git2.workspace = true
