[package]
name = "fleet-tools"
description = "OpAMP Fleet operator tools: fetch, build, hash, and sign package artifacts (ADR-0025)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Two binaries, no library: nothing in this workspace depends on this crate — the arrow points the
# other way (ADR-0025). Both are discovered from `src/bin/` and keep the names they are documented
# and released under.

[dependencies]
clap.workspace = true
# The ring provider every binary installs at startup (ADR-0024, ADR-0023).
opamp = { workspace = true, features = ["client"] }
# ADR-0025: the Client's own `archive` — its 7z Unix-mode convention, used when packing, and its
# unpackers, used by the tests to open what these tools produce. Checking an artifact against the
# code that will install it is the property worth asserting, and it is why these tools live in the
# same workspace as the Client rather than beside it.
fleet-agent = { path = "../fleet-agent" }
fleet-core.workspace = true
# ADR-0018: `pack` writes the containers a Client can open, so it needs the *writers* — `compress`
# for 7z, and the gzip/tar pair for `.tar.gz` and for the tree `opamp-package-fetch` repacks.
sevenz-rust2 = { workspace = true, features = ["compress"] }
flate2.workspace = true
tar.workspace = true
# ADR-0018: package signatures are raw Ed25519 over the artifact bytes; `keygen`/`sign` produce
# exactly what the Client verifies.
ring.workspace = true
sha2.workspace = true
# Every hash, key, and signature these tools print is hex — the form the REST API and
# `supervisor.toml` take them in.
hex.workspace = true
# ADR-0025: `opamp-package-fetch` asks which agent, which version, and which platforms. The
# Client needs the same crate for its interactive install (ADR-0028), so this is one workspace
# dependency serving two crates rather than a second prompt library.
dialoguer.workspace = true
# Listing releases and downloading artifacts. TLS is rustls/ring, as everywhere (ADR-0023) — the
# provider is installed at startup through the Client's own helper, since `rustls-no-provider`
# refuses to build a client without one.
reqwest.workspace = true
rustls.workspace = true
tokio.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
