[package]
name = "server"
description = "OpAMP Fleet Server: dual-transport OpAMP endpoint, REST API, and bundled UI (ADR-0005, ADR-0007)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
opamp.workspace = true
# Streaming a stored package artifact into the response body (ADR-0015) — the same workspace
# dependency the Client already builds on, promoted from dev-only.
futures-util.workspace = true
tokio.workspace = true
axum.workspace = true
axum-server.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
hex.workspace = true
flate2.workspace = true
base64.workspace = true
constant_time_eq.workspace = true
rustls.workspace = true
# Reading the listener's certificate and key, and the client CA that turns mutual TLS on
# (ADR-0035) — the same PEM reader the Client already uses for its trust file.
rustls-pemfile.workspace = true
rcgen.workspace = true
time.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
# ADR-0018: probing the URL of a referenced package — one HEAD, to catch a typo. The Server never
# downloads an artifact, so this is the whole of its outbound HTTP.
reqwest.workspace = true

[dev-dependencies]
tokio-tungstenite.workspace = true
tempfile = "3"
