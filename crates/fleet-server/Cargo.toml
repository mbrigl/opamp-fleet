[package]
name = "fleet-server"
description = "OpAMP Fleet Server: dual-transport OpAMP endpoint, REST API, and bundled UI (ADR-0011, ADR-0012)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The program keeps its name; the package's is a build-time identifier.
[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
opamp = { workspace = true, features = ["server"] }
fleet-core.workspace = true
# Streaming a stored package artifact into the response body (ADR-0019) — the same workspace
# dependency the Client already builds on, promoted from dev-only.
futures-util.workspace = true
tokio.workspace = true
axum.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
hex.workspace = true
ring.workspace = true
flate2.workspace = true
base64.workspace = true
constant_time_eq.workspace = true
# ADR-0039: which CA issued the certificate a connection carries — the client CA's member, or the
# bootstrap CA's enrolling host. The parser rcgen itself uses, already in the tree.
x509-parser.workspace = true
# The configuration the listener of `opamp` serves with (ADR-0036).
rustls.workspace = true
rcgen.workspace = true
time.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
# ADR-0019: probing the URL of a referenced package — one HEAD, to catch a typo. The Server never
# downloads an artifact, so this is the whole of its outbound HTTP.
reqwest.workspace = true

[dev-dependencies]
tokio-tungstenite.workspace = true
tempfile = "3"
