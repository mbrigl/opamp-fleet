# OpAMP Fleet Server configuration (ADR-0011). Every setting has a default, shown here, except [tls]:
# the Server refuses to start without a certificate and key (ADR-0038). For development,
# scripts/dev-pki.sh creates a set and a server.toml that uses it. Start with:
# cargo run -p fleet-server -- --config .dev-pki/server.toml
#
# HOW THIS FILE IS ORDERED, AND WHY IT MATTERS. Every bare key comes first; every [section] comes
# after them. That is not tidiness — it is the only layout in which the commented examples below can
# be switched on safely. A TOML section header captures every bare key that follows it until the
# next header, so a `[telemetry_offer]` sitting above `packages_dir` would swallow it the moment
# anyone uncommented it, and the Server would refuse to start with "unknown field `packages_dir`".
# Add new settings accordingly: a bare key goes in the first half, a section in the second.

# =============================================================================================
# Settings
# =============================================================================================

# TWO LISTENERS, SPLIT BY AUDIENCE (ADR-0038). Both serve TLS 1.3 and nothing older.
#
# The AGENT PLANE: the OpAMP endpoint (/v1/opamp) and the package download the offers point at.
# Port 4320 is the protocol's default. It listens on the loopback until you publish it to where the
# fleet is, with listen = "0.0.0.0:4320". The OPERATOR PLANE — the REST API (/api/v1/*), the API
# docs (/api/v1/docs), and the UI (/) — is the [rest] section in the second half of this file.
listen = "127.0.0.1:4320"

# The connections the Agent plane holds at once (ADR-0038). Past it, a new connection is closed on
# accept and the ones held keep working. Raise it together with the process's file-descriptor
# limit for a fleet larger than this.
max_connections = 10000

# Where Configurations (ADR-0016) are persisted across Server restarts — one JSON file each,
# holding the draft revision an operator edits and, once released, the published revision the
# fleet is offered. SAVING NEVER DISTRIBUTES (ADR-0027): a Configuration reaches the Agents of
# its type (ADR-0016) that its Selector matches only after
# PUT /api/v1/configurations/{name}/publication — body {"published": true}.
config_dir = "fleet-configs"

# The largest OpAMP message accepted or sent, on either transport and in either direction. The
# protocol requires the limit and recommends this default; a fleet of small status reports runs
# comfortably on far less. An oversized request is answered 413, an oversized WebSocket message
# closes the connection with 1009.
max_message_size_bytes = 67108864

# How long an Agent that declares ReportsHeartbeat may be silent before the fleet view calls it
# stale (ADR-0026). It is an observation, never a state change: nothing is torn down, and the next
# report clears it. Ignored when [connection_offer] names a heartbeat interval — the period this
# Server actually asked for is a better answer than a default. Three times the protocol's own
# default heartbeat of 30 s, because one missed beat is a lost packet.
stale_after_secs = 90

# Where software packages are persisted (ADR-0019, reorganised by ADR-0030). Two
# objects share this directory, and the split is the whole of the model:
#
#   <packages_dir>/<agent type>@<version>/   a PACKAGE: what an Agent type runs at a version.
#                                            Its identity is those two tokens and nothing else —
#                                            no name of its own, no Selector, no kind flag —
#                                            holding one artifact per platform. It aims at nobody
#                                            and is never rolled out.
#   <packages_dir>/deployments/<name>.json   a DEPLOYMENT: a name, the channel its Selector aims at,
#                                            at most one Package per Agent type, and each
#                                            artifact's Ed25519 signature. The only thing rolled
#                                            out.
#
# The Agent type is compared raw against the `service.name` the Agents report (ADR-0020), so spell
# it exactly — a Client updating itself is typed `supervisor`.
#
# Create a Package with PUT /api/v1/packages/{agent_type}/{version} — the body has no writable
# field, so {} is all of it. Then store one entry per platform: upload an artifact with
# PUT /api/v1/packages/{agent_type}/{version}/entries/{os}/{arch} (artifact as the body), or point
# the entry at an artifact hosted elsewhere with PUT .../entries/{os}/{arch}/source (ADR-0019:
# url + sha256, optional headers for a private source); the Server stores only that reference and
# never downloads it. No two entries share a platform — writing one again replaces it.
#
# Then put it in a channel and sign it there:
#   PUT  /api/v1/deployments/{name}                    body {"selector": {"channel": "stable"}}
#   PUT  /api/v1/deployments/{name}/packages/{agent_type}/{version}
#   PUT  /api/v1/deployments/{name}/signatures/{agent_type}/{version}/{os}/{arch}
#   POST /api/v1/deployments/{name}/rollout               <- THE ONLY CALL THAT DISTRIBUTES
#
# SAVING NEVER DISTRIBUTES: everything above the rollout stores. An Agent that enrols, or is
# labelled into the channel, afterwards waits for an act of its own.
#
# An Agent belongs to AT MOST ONE Deployment. Two claiming it is a conflict — it is offered
# nothing new and the fleet view names both — so a Selector may not be empty and there is no
# fleet-wide default. A Selector is equality and cannot say "not", so channels are a partition over
# an attribute every Agent carries. The Server prescribes NO key — `channel` (which stream of
# versions a host follows), `region` (where it runs) and `tenant` (whose it is) are examples, not a
# schema. Set it in the host's [attributes], or as a Server label (PUT /api/v1/agents/<uid>/labels),
# which needs no access to the host.
#
# A canary is two channels holding different versions. Finishing the rollout is giving the stable
# channel the canary's version and pressing once more — NOT widening the canary channel, which would
# have both claim the same hosts.
#
# While a Package is rolled out to an Agent its entries are immutable; ship a change as the next
# version, which is a new Package. Taking a bad version back is not a rollout: the fleet only
# moves forward, and what reverses a release is the host's own health-gated rollback.
#
# The download endpoint sits on the Agent plane, behind the same handshake as /v1/opamp: only an
# Agent holding a certificate of the fleet reaches it (ADR-0039). The content hash and the
# signature are what protect an installed binary, and an unsigned entry is offered to nobody.
packages_dir = "fleet-packages"

# The largest package artifact the REST API accepts on upload. A package is a program, not a
# message: an otelcol-contrib binary is a few hundred megabytes, so this bound is far larger than
# max_message_size_bytes above and applies to the package upload route alone.
max_package_size_bytes = 1073741824

# The absolute base URL advertised for downloads. Leave unset in the ordinary case: the offered
# download_url is then a path, which the Client resolves against its own OpAMP endpoint — the
# Agent plane, which is exactly where the download is served (ADR-0038). Set it only when
# downloads must go through a different host, such as a mirror.
# advertised_url = "https://fleet.example:4320"

# =============================================================================================
# Sections — everything below here is a [table]. Nothing but tables may follow.
# =============================================================================================

# TLS, REQUIRED (ADR-0038): both listeners serve HTTPS/WSS with this certificate and key, in TLS 1.3
# only. Without the section the Server refuses to start, naming it.
#
# client_ca_file is REQUIRED too (ADR-0039): the Agent plane asks every peer for a client
# certificate IN THE HANDSHAKE, and one that chains to neither this CA nor the bootstrap CA of
# [enrolment] never reaches the Server — the package download included. The Operator plane asks
# for none; a browser reaches it with the password of [rest.auth].
[tls]
cert_file = "cert.pem"
key_file = "key.pem"
client_ca_file = "client-ca.pem"

# The certificate authority that signs Agent CSRs (ADR-0039). Present is what arms the CSR flow:
# the Server declares AcceptsConnectionSettingsRequest, and an Agent that holds one of its
# certificates renews it automatically once it is two thirds through its life — generating a key
# that never leaves its host, and receiving the certificate as an ordinary connection-settings
# offer. Point client_ca_file above at this CA's certificate.
#
# This is deliberately NOT the listener's own certificate and key: a CA private key sitting where
# the server certificate lives means compromising the Server mints fleet members at will. A
# certificate can be revoked through the REST API (ADR-0049); validity_days bounds what one stolen
# unnoticed is good for, and a Client renews at two thirds of it.
# [client_ca]
# cert_file = "client-ca.pem"
# key_file = "client-ca-key.pem"
# validity_days = 30

# ENROLMENT (ADR-0039): how a fresh host gets its first certificate. It connects with a BOOTSTRAP
# certificate from a CA of its own — never the client CA — and the fleet credential. That opens
# nothing by itself: the connection is admitted only while an operator holds the enrolment window
# open, it may only send a certificate signing request, and the request waits until an operator
# approves it:
#   POST /api/v1/enrolment/window  {"open_for_secs": 3600}   opens it (1 s to 24 h); closed by default
#   GET  /api/v1/enrolments                                  lists the pending requests
#   POST /api/v1/enrolments/<id>/approve | /reject           decides one
# The Client logs its request's key fingerprint, which is the id listed, so an approval can be
# matched to a host. Needs [client_ca], which signs the approved request. Without [enrolment] no
# host enrols, and an operator issues every certificate.
# [enrolment]
# bootstrap_ca_file = "bootstrap-ca.pem"

# THE FLEET CREDENTIAL, REQUIRED (ADR-0039): every OpAMP request — plain-HTTP POST or WebSocket
# upgrade — needs an Authorization header matching a listed credential, in addition to the client
# certificate; anything else is answered 401. Both schemes may be configured at once; several valid
# credentials allow overlapping rotation. The REST API and the UI are not guarded by this — that is
# [rest.auth] at the end of this file.
#
# NO CREDENTIAL IS KEPT IN CLEAR (ADR-0039): a token is listed by its SHA-256, a password by its
# Argon2id hash, and a value in clear is refused at startup. Make each entry with
#   printf '%s' "$TOKEN" | server hash-credential --bearer     (a token of 32 characters or more)
#   server hash-credential --basic                              (asks for the password)
[auth]
bearer_tokens = ["sha256:2c0c8f8b3d6e0f5a1c9a7e4b2d6f8a0c3e5b7d9f1a3c5e7b9d1f3a5c7e9b1d3f"]
# [auth.basic_users]
# fleet = "$argon2id$v=19$m=19456,t=2,p=1$…"

# Repeated admission failures from one peer address (ADR-0039): past max_failures 401s within
# window_secs, the address is answered 429 with Retry-After for backoff_secs, before its credential
# is even compared. The Operator plane counts its own failures the same way.
# [admission_throttle]
# max_failures = 10
# window_secs = 60
# backoff_secs = 300

# The audit record (ADR-0052): one JSON line per security decision — admissions and refusals,
# enrolment, issuance, revocation, rotation, operator acts, package outcomes — in
# <config_dir>/audit/, each line carrying the SHA-256 of the one before. Check it with
#   server audit-verify <config_dir>/audit
# A Server that cannot write it admits no one until it can. Bounded by size, never switched off.
# [audit]
# max_file_bytes = 67108864   # a file this large is closed and the next one started
# keep_files = 16             # the oldest past this is deleted, its last hash recorded first

# Optional connection settings offered to the fleet (ADR-0018): every Agent declaring
# AcceptsOpAMPConnectionSettings is offered these, verifies them by actually connecting, and
# switches only on success. Any subset of the keys works, but not an empty section. To rotate
# credentials: add the new token's hash to [auth] (old and new both accepted), write the token to
# a file only this Server's account can read (mode 0600) and name it below, restart the Server, and
# drop the old hash once the fleet has migrated. The token itself is never in this file
# (ADR-0041). Unless endpoint points to another Server, [auth] must accept the offered credential.
# [connection_offer]
# bearer_token_file = "/etc/opamp-fleet/offered-token"   # or username = "..." / password_file = "..."
# heartbeat_interval_secs = 30             # heartbeat on WebSocket, polling interval on HTTP
# endpoint = "wss://fleet.example:4320/v1/opamp"   # move the fleet to a new endpoint

# WHERE THE FLEET SENDS ITS OWN TELEMETRY (ADR-0048). Each signal is independent, and each is
# offered only to Agents that declare they can report it. The endpoints are full OTLP/HTTP URLs
# WITH PATH — this Server appends no /v1/metrics for you, because guessing a receiver's routing is
# how telemetry disappears into a 404 nobody looks at.
#
# An Agent sends process metrics for itself and for each process it supervises, its own log output,
# and spans over the operations that already have a lifecycle here (a configuration applied, a
# package installed, a self-update). It refuses a cleartext http:// destination anywhere but the
# loopback literals 127.0.0.1 and ::1 — by address, never by name (ADR-0048).
#
# Nothing about this is configured on the Client: the capability means "report to the destination
# the Server specifies", so this section is the only place it comes from.
#
# Five things worth knowing before you fill this in:
#
#  - The destinations are FLEET-WIDE. There is no Selector here as there is on Configurations
#    (ADR-0016) and packages (ADR-0020): every Agent is offered the same three addresses. The only
#    per-Agent variation is which of the three signals it gets, and that follows the capabilities
#    the Agent itself declares.
#  - A change here needs a SERVER RESTART. The offer is compiled once at startup; there is no
#    reload, over SIGHUP or otherwise, and the REST API does not manage it.
#  - The headers below apply to ALL THREE signals. There is one header map, not one per signal —
#    which is the right shape when the three URLs are one collector, and the wrong one if you split
#    them across backends that want different tokens.
#  - Metrics arrive every 10 SECONDS per Agent, the interval the protocol recommends. Size the
#    backend for it: that is six exports a minute per Agent — six hundred a minute across a hundred
#    of them — each carrying process metrics for the Agent and for every process it supervises.
#  - Offer only what you can receive. A signal you leave unset is simply not offered, and the Agent
#    reports nothing for it — which costs less than a destination that answers 404 forever.
#  - What this section says, it says about ALL THREE signals (ADR-0048). An Agent already reporting
#    traces STOPS when you remove traces_endpoint from here: the offer is the whole truth about own
#    telemetry, not a list of changes. Which is what makes a destination removable at all.
#
# TURNING IT OFF. An endpoint set to the empty string is an explicit withdrawal — the Agent shuts
# that exporter down, forgets the destination, and acknowledges it like any other offer:
#
#     [telemetry_offer]
#     metrics_endpoint = ""      # stop reporting metrics
#
# That is the only way to say "stop all three", because a Server that offers nothing says nothing:
# DELETING this section does not switch anything off. It withdraws nothing, so that a Server with no
# telemetry of its own cannot tear down a fleet another Server pointed at a collector — and so an
# Agent keeps reporting across restarts, which is the point of the destination being persisted.
# To stop a fleet: set the endpoints empty, restart the Server, let the Agents acknowledge, then
# remove the section.
#
# Pick ONE of the three shapes below. They are alternatives, not a sequence — switching on two of
# them leaves the file with a duplicated table header, which is an error rather than a merge.
#
# (1) Development — the stack in .devcontainer/ comes up with the Dev Container and publishes
#     the Collector's OTLP/HTTP port on the host. Cleartext is accepted here because the address
#     is a loopback literal, the one place plaintext is allowed (ADR-0048) — 127.0.0.1, not the
#     name localhost, and why the ports are published rather than left on a compose network.
# [telemetry_offer]
# metrics_endpoint = "http://127.0.0.1:4318/v1/metrics"
# traces_endpoint = "http://127.0.0.1:4318/v1/traces"
# logs_endpoint = "http://127.0.0.1:4318/v1/logs"

# (2) Production — TLS in front of the collector, and a token if it wants one. An Agent REFUSES a
#     cleartext destination anywhere but 127.0.0.1 or ::1 — a LAN address and a host name included
#     (ADR-0048): it is not warned about and not downgraded, the offer comes back FAILED naming the
#     reason. Terminate TLS 1.3 in front of the receiver and offer the https:// URL.
# [telemetry_offer]
# metrics_endpoint = "https://collector.example:4318/v1/metrics"
# traces_endpoint = "https://collector.example:4318/v1/traces"
# logs_endpoint = "https://collector.example:4318/v1/logs"
# [telemetry_offer.headers]
# Authorization = "Bearer a-telemetry-token"
#
# (3) Metrics only — the smallest useful shape: one signal, no header, nothing else offered.
# [telemetry_offer]
# metrics_endpoint = "https://collector.example:4318/v1/metrics"

# THE OPERATOR PLANE (ADR-0038): the REST API, the API docs, and the bundled UI, on their own
# listener, over the TLS of [tls]. This port carries the authority to reconfigure and re-package the
# entire fleet — hence loopback by default. Reach it through an SSH tunnel, or publish it
# deliberately with listen = "0.0.0.0:4321": off the loopback [rest.auth] is required, and the
# Server refuses to start without it.
#
# It must differ from the Agent plane's `listen` above; equal addresses are refused at startup,
# by name, instead of surfacing later as "address already in use".
[rest]
listen = "127.0.0.1:4321"
max_connections = 256

# Basic authentication over the WHOLE Operator plane (ADR-0039): the REST API, the OpenAPI document,
# the API docs, and the UI. Optional on the loopback, required anywhere else. Every request
# then needs `Authorization: Basic <base64(user:password)>`; anything else is answered 401 with a
# challenge, which is what makes a browser ask for the password instead of showing a bare error —
# so the UI needs no login page.
#
# Several users are how a credential is rotated, or one operator's is withdrawn on its own. The
# operator tools carry it in the URL they are given: --server https://fleet-admin:secret@host:4321
#
# This is authentication, not authorization: everyone listed can do everything the plane offers.
# Basic sends the password on every request; the plane's TLS is what keeps it off the wire. The
# password is listed by its Argon2id hash: `server hash-credential --basic` (ADR-0039).
# [rest.auth.basic_users]
# fleet-admin = "$argon2id$v=19$m=19456,t=2,p=1$…"
