# OpAMP Fleet Server configuration (ADR-0008). Every setting is optional; the values shown are the
# defaults. Start with: cargo run -p server -- --config config/server.toml

# TWO LISTENERS, SPLIT BY AUDIENCE (ADR-0066, superseding ADR-0005 on this point).
#
# The AGENT PLANE: the OpAMP endpoint (/v1/opamp) and the package download the offers point at.
# Port 4320 is the protocol's default, and it is open to the network because that is where the
# fleet is.
listen = "0.0.0.0:4320"

# The OPERATOR PLANE — the REST API (/api/v1/*), the API docs (/api/v1/docs), and the UI (/) —
# is the [rest] section at the end of this file, because a TOML section ends the bare keys below.

# Where Configurations (ADR-0012) are persisted across Server restarts — one JSON file each,
# holding the draft revision an operator edits and, once released, the published revision the
# fleet is offered. SAVING NEVER DISTRIBUTES (ADR-0055): a Configuration reaches the Agents of
# its type (ADR-0054) that its Selector matches only after
# PUT /api/v1/configurations/{name}/publication — body {"published": true}.
config_dir = "fleet-configs"

# The largest OpAMP message accepted or sent, on either transport and in either direction. The
# protocol requires the limit and recommends this default; a fleet of small status reports runs
# comfortably on far less. An oversized request is answered 413, an oversized WebSocket message
# closes the connection with 1009.
max_message_size_bytes = 67108864

# Optional TLS (ADR-0007): with a certificate and key BOTH listeners serve HTTPS/WSS instead.
# client_ca_file turns on mutual TLS (ADR-0035) and belongs to the Agent plane alone: every request
# to /v1/opamp must then arrive over a connection carrying a client certificate that bundle
# verifies. Client authentication stays optional at the TLS layer, because the same listener serves
# the package download, which a Client fetches presenting no certificate — so only the OpAMP route
# requires one.
# [tls]
# cert_file = "cert.pem"
# key_file = "key.pem"
# client_ca_file = "client-ca.pem"

# EVERY CONFIGURED PROOF MUST SUCCEED. [auth] alone behaves as it always has; client_ca_file alone
# makes the OpAMP endpoint certificate-only; both configured means BOTH are required of every
# request, not either one. Turning mutual TLS on can therefore never widen admission — but it can
# lock out a host that has no certificate yet, so let the fleet enrol first (below) and set
# client_ca_file after.

# Optional certificate authority for the CSR flow (ADR-0035). Present is what arms it: the Server
# declares AcceptsConnectionSettingsRequest, and an Agent that has no certificate — or holds one two
# thirds through its life — generates a key (which never leaves its host), sends a signing request,
# and receives the certificate as an ordinary connection-settings offer.
#
# This is deliberately NOT the listener's own certificate and key: a CA private key sitting where
# the server certificate lives means compromising the Server mints fleet members at will. Generate a
# separate self-signed CA and point client_ca_file above at its certificate.
#
# Admission is the approval — a request that reached this Server already satisfied every proof the
# endpoint requires. There is no approval queue, and no revocation: validity_days plus renewal is
# what bounds a certificate, so keep it short rather than generous.
# [client_ca]
# cert_file = "client-ca.pem"
# key_file = "client-ca-key.pem"
# validity_days = 90

# Optional authentication on the OpAMP endpoint (ADR-0013). When the section is present, every
# OpAMP request — plain-HTTP POST or WebSocket upgrade — needs an Authorization header matching
# any listed credential; anything else is answered 401. Both schemes may be configured at once;
# several valid credentials allow overlapping rotation. Without [auth] the endpoint stays open.
# REST API and UI are not guarded by this — that is [rest.auth] at the end of this file (ADR-0067).
# [auth]
# bearer_tokens = ["a-long-random-token"]
# [auth.basic_users]
# fleet = "a-strong-password"

# Optional connection settings offered to the fleet (ADR-0014): every Agent declaring
# AcceptsOpAMPConnectionSettings is offered these, verifies them by actually connecting, and
# switches only on success. Any subset of the keys works, but not an empty section. To rotate
# credentials: add the new token to [auth] (old and new both accepted), point the offer at it,
# restart the Server, and drop the old token once the fleet has migrated. Unless endpoint points
# to another Server, the offered credential must be in the [auth] accepted set.
# [connection_offer]
# bearer_token = "a-long-random-token"     # or username = "..." / password = "..."
# heartbeat_interval_secs = 30             # heartbeat on WebSocket, polling interval on HTTP
# endpoint = "wss://fleet.example:4320/v1/opamp"   # move the fleet to a new endpoint

# How long an Agent that declares ReportsHeartbeat may be silent before the fleet view calls it
# stale (ADR-0038). It is an observation, never a state change: nothing is torn down, and the next
# report clears it. Ignored when [connection_offer] names a heartbeat interval — the period this
# Server actually asked for is a better answer than a default. Three times the protocol's own
# default heartbeat of 30 s, because one missed beat is a lost packet.
stale_after_secs = 90

# Optional destinations for the Agents' own telemetry (ADR-0036). Each signal is independent, and
# each is offered only to Agents that declare they can report it. The endpoints are full OTLP/HTTP
# URLs WITH PATH — this Server appends no /v1/metrics for you, because guessing a receiver's routing
# is how telemetry disappears into a 404 nobody looks at.
#
# An Agent sends process metrics for itself and for each process it supervises, its own log output,
# and spans over the operations that already have a lifecycle here (a configuration applied, a
# package installed, a self-update). It refuses a cleartext http:// destination beyond loopback.
#
# Nothing about this is configured on the Client: the capability means "report to the destination
# the Server specifies", so this section is the only place it comes from.
# [telemetry_offer]
# metrics_endpoint = "https://collector.example:4318/v1/metrics"
# traces_endpoint = "https://collector.example:4318/v1/traces"
# logs_endpoint = "https://collector.example:4318/v1/logs"
# [telemetry_offer.headers]
# Authorization = "Bearer a-telemetry-token"

# Where software packages are persisted (ADR-0015, organised as Sets by ADR-0052): one directory
# per Set, holding its metadata and one artifact per platform. A Set is identified by its NAME,
# the AGENT TYPE it is built for, and its VERSION — stated at creation, never edited; a new
# version is a new Set. The type is compared raw against the `service.name` the Agents report
# (ADR-0034), so spell it exactly — a Client updating itself is typed `opamp-fleet-client`.
#
# Create a Set (always a draft) with
# PUT /api/v1/packages/{name}/{agent_type}/{version} — body {"selector": {...}, "addon": false}.
# Then store one entry per platform: upload an artifact with
# PUT /api/v1/packages/{name}/{agent_type}/{version}/entries/{os}/{arch} (artifact as the body,
# optional Ed25519 signature=<hex>), or point the entry at an artifact hosted elsewhere with
# PUT .../entries/{os}/{arch}/source (ADR-0018: url + sha256, optional headers for a private
# source); the Server stores only that reference and never downloads it. No two entries share a
# platform — writing one again replaces it, while the Set is a draft.
#
# Aim the Set with its Selector (ADR-0017), editable in every state via PUT .../selector: an empty
# Selector targets every Agent of the Set's type; among Sets of one name the most specific
# Selector wins, and among equally specific ones the greater version — so a canary ring is one
# Selector edit, and finishing the rollout is widening it.
#
# Finally release it with PUT .../publication — body {"published": true} (ADR-0043). SAVING NEVER
# DISTRIBUTES: a Set is a draft, offered to nobody, until this call — and publishing an empty Set
# is refused. While a Set is published its entries are immutable (retract it to change them, or
# create the next version as its own Set). {"published": false} withdraws the offer; nothing is
# uninstalled, and the fleet falls back to the newest version still published under the same name
# — which is what a rollback is now: a publication move, not a hidden history (ADR-0052 replaces
# ADR-0019's one-step rollback).
#
# The download endpoint sits on the unauthenticated REST plane — the content hash and signature
# are what protect an installed binary, so sign packages and configure the key on the Client.
packages_dir = "fleet-packages"

# The largest package artifact the REST API accepts on upload. A package is a program, not a
# message: an otelcol-contrib binary is a few hundred megabytes, so this bound is far larger than
# max_message_size_bytes above and applies to the package upload route alone.
max_package_size_bytes = 1073741824

# The absolute base URL advertised for downloads. Leave unset in the ordinary case: the offered
# download_url is then a path, which the Client resolves against its own OpAMP endpoint — the
# Agent plane, which is exactly where the download is served (ADR-0066). Set it only when
# downloads must go through a different host, such as a mirror.
# advertised_url = "https://fleet.example:4320"

# THE OPERATOR PLANE (ADR-0066): the REST API, the API docs, and the bundled UI, on their own
# listener. This port carries the authority to reconfigure and re-package the entire fleet, and
# without [rest.auth] below it is open to whoever reaches it — hence loopback by default. Reach it
# through an SSH tunnel, or publish it deliberately with listen = "0.0.0.0:4321".
#
# It must differ from the Agent plane's `listen` above; equal addresses are refused at startup,
# by name, instead of surfacing later as "address already in use".
[rest]
listen = "127.0.0.1:4321"

# Optional Basic authentication over the WHOLE Operator plane (ADR-0067): the REST API, the
# OpenAPI document, the API docs, and the UI. Absent means open, as it has been. Every request
# then needs `Authorization: Basic <base64(user:password)>`; anything else is answered 401 with a
# challenge, which is what makes a browser ask for the password instead of showing a bare error —
# so the UI needs no login page.
#
# Several users are how a credential is rotated, or one operator's is withdrawn on its own. The
# operator tools carry it in the URL they are given: --server http://fleet-admin:secret@host:4321
#
# This is authentication, not authorization: everyone listed can do everything the plane offers.
# Basic sends the password on every request, so pair it with [tls] — or a TLS-terminating proxy —
# whenever this plane is not on loopback. The Server warns at startup if it is not.
# [rest.auth.basic_users]
# fleet-admin = "a-strong-password"
