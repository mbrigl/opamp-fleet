# OpAMP Fleet Client configuration. Every setting is optional; the values shown are the
# defaults. Start with: cargo run -p client -- --config config/client.toml

# The Server's OpAMP endpoint. The URL scheme selects the transport:
#   ws:// or wss://    → WebSocket (the default: Server pushes changes within seconds)
#   http:// or https:// → plain HTTP polling (see poll_interval_secs)
endpoint = "ws://127.0.0.1:4320/v1/opamp"

# The Agent's service.instance.name — the operator's name for *this* Client, shown in the fleet UI
# and matchable by a Selector. Its service.name is the constant type `opamp-fleet-client`, the same
# on every host, which is what a package or Configuration aimed at every Client matches.
name = "opamp-fleet-client"

# Poll interval of the plain-HTTP transport, in seconds (the protocol's default: 30).
poll_interval_secs = 30

# Heartbeat interval over the WebSocket transport, in seconds (the protocol's default: 30).
# 0 disables heartbeats; on plain HTTP every poll already is the periodic report.
heartbeat_interval_secs = 30

# The largest OpAMP message accepted or sent, on either transport and in either direction — the
# Supervisor Endpoint included. The protocol requires the limit and recommends this default; a
# message past it is never sent, and an oversized one from the Server is refused.
max_message_size_bytes = 67108864

# Where the Client persists its instance_uid, the received remote configuration, and any
# Server-offered connection settings. Persisted connection settings override
# endpoint, [auth], and the intervals above; delete <state_dir>/connection-settings.pb to revert.
# A package for the Client itself is streamed to <state_dir>/packages/ first, so this
# directory needs room for one agent binary.
state_dir = "client-state"

# The Client's own log on disk, written **only while it runs as a service** — in the
# foreground it goes to stderr alone, because somebody is reading it there. It exists because the
# Windows SCM discards a service's stderr, so a Client installed there had no readable log at all;
# on Linux and macOS it duplicates what journalctl and `log show` already keep, so that "where are
# the logs" has one answer on every platform. This is not the Client's own telemetry: that needs
# a Server it can already reach, which is exactly what a start-up failure does not have.
# It is the machine's — nothing here ever arrives from the Server.
# [logging]
# enabled = true            # false writes nothing; for a host whose platform already collects stderr
# dir = "/var/log/opamp"    # default: <state_dir>/logs, which survives updates and `uninstall`
# keep = 7                  # daily files kept, then deleted. A bound, not a switch: 0 is refused

# Where the per-Supervisor directories live; the default is <state_dir>/supervisors.
# Each Supervisor owns everything under its own directory — its identity, the received
# configuration, its program/, and the artifact staging its updates go through:
#
#   <supervisor_dir>/<name>/instance-uid, remote-config.pb, config/, program/, packages/
#
# Set this when the programs must not live where the state does: /var/lib is often mounted
# noexec, and it is sized for state rather than for a few hundred megabytes of Collector.
# supervisor_dir = "/opt/opamp-fleet/supervisors"

# Operator-defined attributes, reported by every Agent this Client presents so the
# Server's Selectors can target them. A [[supervisor]] block may add its own [supervisor.attributes]
# table, which overrides these per key.
# [attributes]
# env = "prod"

# Optional Gateway Mode: this Client stands at a network boundary, accepts OpAMP from
# other Clients, and folds them onto a small pool of upstream connections. It composes with the
# [[supervisor]] blocks below — a host may supervise its own processes and gateway for others.
#
# upstream_connections is a CAP, not a count: connections are opened as Agents appear, so a Gateway
# in front of three Agents holds three. Each Agent sticks to its connection while that lives.
#
# The Gateway makes no authentication decisions — it forwards each peer's credential upstream
# untouched. Mutual TLS is per hop: [gateway.tls] verifies the Agents connecting to *this* Client,
# while the identity presented to the Server is the one in [tls] below. The endpoint above must be
# ws:// or wss://, since a polling connection cannot carry the Server's pushes to the Agents behind
# a Gateway.
# [gateway]
# listen = "0.0.0.0:4320"
# upstream_connections = 10
# [gateway.tls]
# cert_file = "gateway.pem"
# key_file = "gateway-key.pem"
# client_ca_file = "client-ca.pem"

# Optional TLS. Every key is optional on its own, so this section may carry a
# trust override, a client identity, or both.
# [tls]
# ca_file = "ca.pem"          # replaces the built-in roots — the private-CA deployment
# cert_file = "client.pem"    # this Client's certificate, for a Server on mutual TLS
# key_file = "client-key.pem" # its private key; cert_file and key_file go together or not at all
#
# The identity above is the one an operator provisions — including the BOOTSTRAP certificate a
# fresh host enrols with. A certificate the Server issued outranks it: the Client stores that pair
# in <state_dir> as client-cert.pem and client-key.pem and prefers it, the same way persisted
# connection settings outrank the endpoint written here. Deleting the stored pair
# reverts to this one.
#
# Enrolment needs nothing here. When the Server declares that it signs (a [client_ca] section in
# its server.toml), a Client with no certificate generates a key — which never leaves this host —
# sends a signing request, and gets a certificate back through the ordinary offer flow; it renews
# the same way once the certificate is two thirds through its life. So the useful order is: let the
# fleet enrol, then have the Server require certificates.

# Optional package verification. With a key set, every Server-offered package MUST
# carry a valid Ed25519 signature over its artifact; without it, an unsigned package installs on
# its content hash alone and a signed one is refused. A [[supervisor]] block takes package
# delivery by naming its program with a bare file name (see the blocks below); *which*
# artifact it then receives is the Server's decision, expressed as that package's Selector —
# never a key in this file.
# Generate a key and sign artifacts with the `opamp-package-sign` helper
# (cargo run -p client --bin opamp-package-sign -- keygen): its keygen output is this value.
# [packages]
# verification_key = "<hex-encoded Ed25519 public key>"
# archive_key = "the key an encrypted .7z was packed with"   # opens an encrypted
#                          # artifact. One secret for the fleet — a single archive serves every
#                          # Agent — and never the [auth] credential, which the Server rotates on
#                          # its own: a rotation would leave every archive unopenable.
#                          # The Server never learns this key; the artifact stays encrypted
#                          # wherever it is stored and is opened only on the host that runs it.

# Consent for the Server to replace *this Client's own* binary. Absent — the default —
# the Client's Agent declares no package capability at all and no offer can reach it.
#
# Unlike a [[supervisor]], which only consents while the Server picks the artifact, the
# Client must NAME its package: an offer under any other name is refused and reported, never
# applied. This is one of two independent guards, and it is the one on this side of the wire — the
# Server will not offer a package built for another Agent type either, and this Client's
# own type is the constant `opamp-fleet-client`. Neither replaces the other: an operator who typed a
# Collector artifact as `opamp-fleet-client` gets past the Server, and this name is what is left.
#
# What happens on an accepted offer: the artifact is verified like any other, staged as a new
# version *beside* the running one in the versioned install layout, and proved by running
# `client self-check` on it before the `current` pointer moves. The process then exits and asks the
# service manager to restart it — it does not restart itself. A marker in state_dir carries the
# outcome across that restart: the new version commits itself once it reaches the Server, and one
# that will not stay up is rolled back to its predecessor after three attempts.
# [self_update]
# package = "opamp-fleet-client"

# Optional authentication toward the Server: exactly one scheme — bearer_token, or
# username and password together. The Authorization header rides every plain-HTTP request and
# the WebSocket upgrade. Without TLS the credentials travel in cleartext; pair with wss:// or
# https:// beyond the loopback.
# [auth]
# bearer_token = "a-long-random-token"
# --- or ---
# username = "fleet"
# password = "a-strong-password"

# ── Supervisor Mode ────────────────────────────────────────
# Each [[supervisor]] block runs one Supervisor managing one local process; each appears to the
# Server as its own Agent, all sharing this Client's one connection. Without any block, the
# Client presents itself as a single Agent, as above. The three blocks below show the three
# ways a Managed Process is brought into the fleet.
#
# How a block names its program — `binary` for a collector, `command` for a custom one — is also
# what decides whether the Server may update it, because replacing a program means
# writing in the directory it sits in:
#
#   a bare file name    the program lives in <supervisor_dir>/<name>/program/, a directory this
#                       Client creates and owns. It takes package updates.
#   an absolute path    the machine's program, put there by a distribution package or by
#                       configuration management. It is started, never written to.
#
# Anything in between — ./x, bin/x — fails at startup rather than being guessed at. Note that a
# bare name is NOT searched for in $PATH; it names a file in that one directory.
#
# Every block reports two names, and they answer different questions:
#
#   name           service.instance.name — *which* Agent this is. Yours, unique per block, also the
#                  directory name, so it follows the usual name grammar (lowercase, digits, '-').
#                  A Managed Process can never overwrite it.
#   service_name   service.name — *what* this Agent is, the Agent type. Optional. A Managed Process
#                  that reports its own type wins over it (a Collector with the opampextension
#                  states the dist.name it was built with); with neither, the program's file name
#                  is used. Unlike `name` it may be a reverse FQDN, as the protocol recommends.
#
# Aim at the type to reach every Agent of a kind, at the instance name to reach exactly one:
#
#   curl -X PUT -H 'Content-Type: application/json' \
#        -d '{"selector": {"service.instance.name": "edge-01"}}' \
#        http://<server>:4320/api/v1/packages/otelcol/otelcol-contrib/0.109.0/selector

# 1. A Collector WITH the opampextension — it reports its own description, health, and
# effective configuration to the Supervisor Endpoint. The extension ships only in the Contrib
# distribution, hence otelcol-contrib. Prebuilt distributions are published at
# https://github.com/open-telemetry/opentelemetry-collector-releases/releases — one .tar.gz per
# platform, uploadable as a package exactly as published; the binary inside is named after the
# distribution (otelcol-contrib, otelcol), which is why `binary` below says the same.
# Pin endpoint_port and make sure the configuration the
# Server distributes carries the extension pointing at it:
#
#   extensions:
#     opamp:
#       server:
#         ws:
#           endpoint: ws://127.0.0.1:4321/v1/opamp
#           tls:
#             insecure: true
#   service:
#     extensions: [opamp]
#
# [[supervisor]]
# type = "collector"
# name = "otelcol-contrib"
# binary = "otelcol-contrib"  # bare, so it lives in this Supervisor's program/ directory and
#                          # takes binary updates from the Server:
#                          # the artifact the Server selects for this Agent is verified, swapped
#                          # over it, health-gated on apply_grace_secs, and rolled back if it will
#                          # not stay up. *Which* artifact is the Server's decision — give the
#                          # Set a Selector there (PUT /api/v1/packages/<name>/<type>/<version>/
#                          # selector), so a rollout is aimed centrally instead of from this file.
#                          # An artifact that is a .tar.gz is unpacked here: the member
#                          # whose file name matches this one is what gets installed, so an
#                          # upstream release can be uploaded exactly as published.
#                          # Put the first copy there yourself; every later one arrives by package.
# args = []                # extra arguments, appended after the --config flags
# endpoint_port = 4321     # the Supervisor Endpoint on 127.0.0.1 the extension connects to
# stop_timeout_secs = 10   # graceful-stop budget before the process is killed
# apply_grace_secs = 3     # how long a restarted process must survive before a received
#                          # configuration is acknowledged APPLIED (0 = acknowledge on start)
# [supervisor.env]         # optional environment for the process
# OTLP_HTTP_ENDPOINT = "127.0.0.1:4318"

# 2. A Collector WITHOUT the extension — the core distribution has no opampextension, so the
# Supervisor observes it from the outside (spawn, exit, restart). endpoint_port stays unset:
# the endpoint still comes up on an ephemeral port (it always does), nothing ever connects.
# Every received config-map entry is written to <supervisor_dir>/<name>/config/ under its
# Configuration's name and passed as its own --config; a change restarts the collector.
# The absolute path here is the other half of the rule above: this Collector came from the
# machine's package manager, so the Server never writes over it — it is supervised, not updated.
# [[supervisor]]
# type = "collector"
# name = "otelcol"
# binary = "otelcol"
# service_name = "otelcol"   # without the extension nothing reports a type, so state one here;
#                            # left out, the program's file name ("otelcol") is used anyway.
# [supervisor.env]           # optional environment for the process; same variable as in the
#                            # block above, its own value here — the receiver port is offset so
#                            # both collectors can run on one host (see config/examples/)
# OTLP_HTTP_ENDPOINT = "127.0.0.1:14318"

# 3. Any other process — a Foreign Agent under a generic "command" Custom Supervisor. The
# process speaks no OpAMP, so the Supervisor observes it from the outside (spawn, exit,
# restart). Every received config-map entry is written to <supervisor_dir>/<name>/config/
# under its Configuration's name; point the program's own flag at that file and
# the Supervisor restarts the process on a change so it re-reads it. Named by an absolute
# path here, so it is the machine's program: installed and updated by whatever put it there,
# never by the Server. A bare file name instead would put it in this Supervisor's own
# program/ directory and consent to package delivery, like `binary` above.
#
# args, working_dir and env values may use two placeholders naming this Supervisor's own
# directories, so nothing has to be kept in sync with state_dir or supervisor_dir:
#
#   ${supervisor_dir}   <supervisor_dir>/<name>       — everything this Supervisor owns
#   ${config_dir}       <supervisor_dir>/<name>/config — the written configuration entries
#
# Any other ${...} is passed to the process untouched, so an agent's own variable syntax keeps
# working — which also means a misspelled placeholder is handed over rather than refused. The
# program itself (command, binary) is never substituted: its written form is what decides package
# consent, and that must be readable in this file.
# [[supervisor]]
# type = "command"
# name = "my-agent"
# command = "/opt/my-agent/bin/my-agent"
# args = ["--config", "${config_dir}/my-agent-conf"]
# working_dir = "/var/lib/my-agent"     # optional
# version_args = ["--version"]          # what it reports as service.version
# [supervisor.attributes]               # optional attributes for this Agent
# role = "edge"
# [supervisor.env]                      # optional environment for the process
# LOG_LEVEL = "info"
