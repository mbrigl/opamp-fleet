/*
 * The root configuration of a fleet-managed Icinga 2 Agent (ADR-0068).
 *
 * Delivered as a Configuration named `icinga2-conf`, which the Supervisor names on the command
 * line with `-c`. Everything else is pulled in from here: a relative `include` resolves against
 * this file, so a second Configuration — delivered as `icinga2-zones` beside it — is included by
 * name, without anyone having to know the absolute path it landed at.
 *
 * What is deliberately absent: `constants.conf`, `features-enabled/`, `conf.d/` and `zones.d/`.
 * Those live under Icinga's compiled-in configuration directory, which a fleet-delivered tree
 * cannot relocate — so this file declares what they would have declared, as objects.
 */

// The Icinga Template Library. The Supervisor points `IncludeConfDir` at the delivered tree, so
// this resolves inside the package rather than to a copy that happens to be on the host.
include <itl>

// The plugin CheckCommands — `load`, `disk`, `http` and the rest. Without this line the templates
// exist but the commands do not, and a check the parent assigns fails with "CheckCommand does not
// exist" rather than with a result. The commands run the plugins in the delivered tree, which is
// where `PluginDir` points.
include <plugins>

// The topology: this node and its parent. Kept in its own Configuration so a Selector can aim a
// different one at a different set of hosts.
include "icinga2-zones"

// The cluster listener. `accept_config` and `accept_commands` are what let the parent send this
// Agent its checks; the certificate comes from enrolment (ADR-0069) and is found under
// `DataDir/certs/<NodeName>.crt` without being named here.
object ApiListener "api" {
  accept_config = true
  accept_commands = true
}

// Executes the checks the parent assigns.
object CheckerComponent "checker" { }

// Icinga's own log. `LogDir` is where the Supervisor pointed it — beside the delivered tree, so a
// package update does not take the log with it.
object FileLogger "mainlog" {
  severity = "information"
  path = LogDir + "/icinga2.log"
}
