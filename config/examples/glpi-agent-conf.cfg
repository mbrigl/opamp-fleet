# Minimal test Configuration for the GLPI Agent supervisor of docs/manual/glpi-agent.md, written
# in the GLPI Agent's own `key = value` format. Uploaded by `opamp-fleetctl package fetch --agent
# glpi-agent` and seeded by scripts/seed_test_configs.sh as Configuration "glpi-agent-conf",
# typed `glpi-agent` — the Agent type the `glpi` kind presents — so it reaches no other Agent.
#
# The Configuration's NAME is the file name written into the Supervisor's config directory, and
# the kind reads exactly that file: --conf-file=${config_dir}/glpi-agent-conf. A name
# carries no extension: a Configuration name is lowercase letters, digits and '-', and
# `--conf-file` reads whatever path it is given.
#
# With --conf-file this file is the agent's WHOLE configuration: the native
# /etc/glpi-agent/agent.cfg (etc\agent.cfg on Windows) is not read. Roll it out before the
# supervisor block reaches the host — the agent refuses to start on a --conf-file that does not
# exist yet, and the Supervisor holds after three attempts until the first apply ends the hold.
#
# ${config_dir} and ${supervisor_dir} are NOT expanded here: they are placeholders for a block's
# own strings. --daemon and the logger flags belong to the `glpi` kind, which holds them.
# `conf-reload-interval` is unnecessary: a changed Configuration restarts the agent.

server = https://glpi.example.com/front/inventory.php
tag = fleet

# The agent serves an embedded web interface on 62354. A test host running several agents does
# not need it, and one listener less is one port conflict less.
no-httpd = 1

# Upper limit of the random delay before the first contact, in seconds (default 3600). 60 makes
# a test run show its inventory while you are still watching it.
delaytime = 60

# no-ssl-check = 1                        # a GLPI server on a private CA — prefer fixing trust
# no-task = netdiscovery,netinventory     # inventory only
