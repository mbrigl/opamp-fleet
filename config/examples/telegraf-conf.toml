# Minimal test Configuration for the "telegraf" supervisor example in config/supervisor.toml —
# Telegraf under the `telegraf` kind, which knows its invocation and has no settings.
# Distributed by scripts/seed_test_configs.sh, and uploaded by `opamp-fleetctl package fetch
# --agent telegraf`, as Configuration "telegraf-conf", stated for the Agent type `telegraf` — the
# kind's service_name — so it fits no other kind of Agent.
#
# The Configuration's NAME is the file name written into the Supervisor's config directory, and
# the kind starts Telegraf with exactly that file: --config ${config_dir}/telegraf-conf. A name
# carries no extension: a Configuration name is lowercase letters, digits and '-', and neither
# Telegraf nor the Supervisor cares what the file is called.
#
# Roll it out before the supervisor block reaches the host: Telegraf exits on a `--config` that
# names no file, so the Supervisor tries three times and then holds until the first apply. Once
# it runs, a changed Configuration is applied in place: the `telegraf` kind sends SIGHUP where
# signals exist, so Telegraf re-reads this file instead of being restarted, and restarts on Windows.
#
# ${config_dir} and ${supervisor_dir} are NOT expanded here: they are placeholders for a block's
# own strings. Paths in a Configuration body are written out.

[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = false

# Telegraf's own metrics — an input that reads nothing from the host and needs no privileges,
# so this configuration is as portable as the Collector examples beside it.
[[inputs.internal]]

# stdout: a Managed Process inherits the Client's own stdout, so the lines land wherever the
# Client writes — the terminal in the foreground, the log file under a service manager.
# Point this at a real output once the host should actually ship data.
[[outputs.file]]
  files = ["stdout"]
  data_format = "influx"

# To ClickHouse: send OTLP/gRPC to an OpenTelemetry Collector and let its ClickHouse exporter write
# the rows — the shape of observability/ in this repository, whose Collector listens on 4317. The
# rows then land in the tables the Collector already writes for every other agent. Replace the
# outputs.file block above with this one; the address is the Collector's, written out.
# [[outputs.opentelemetry]]
#   service_address = "127.0.0.1:4317"
