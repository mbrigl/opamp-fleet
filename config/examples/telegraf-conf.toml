# Minimal test Configuration for the "telegraf" supervisor example in config/supervisor.toml —
# a Foreign Agent under the generic "command" Supervisor, observed from the outside.
# Distributed by scripts/seed_test_configs.sh as Configuration "telegraf-conf" (ADR-0012),
# typed `telegraf` (ADR-0054) so it reaches no other kind of Agent — the block states no
# service_name, so this Agent's type is its program's file name.
#
# The Configuration's NAME is the file name written into the Supervisor's config directory, so
# the block must read exactly that file: args = ["--config", "${config_dir}/telegraf-conf"].
# A name carries no extension: Configuration names follow the ADR-0010 grammar (lowercase
# letters, digits and '-'), and neither Telegraf nor the Supervisor cares what the file is called.
#
# Roll it out before the supervisor block reaches the host: Telegraf exits on a `--config` that
# names no file, so the Supervisor tries three times and then holds until the first apply. Once
# it runs, a changed Configuration is applied in place — the block's reload_signal = "HUP" makes
# Telegraf re-read this file instead of being restarted (unix only).
#
# ${config_dir} and ${supervisor_dir} are NOT expanded here: they are placeholders for the
# block's args, working_dir and env (ADR-0022). Paths in a Configuration body are written out.

[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = false

# Telegraf's own metrics — an input that reads nothing from the host and needs no privileges,
# so this configuration is as portable as the Collector examples beside it.
[[inputs.internal]]

# stdout: a Managed Process inherits the Client's own stdout, so the lines land wherever the
# Client writes — the terminal in the foreground, the log file under a service manager.
# Point this at a real output once the host should actually ship data.
[[outputs.file]]
  files = ["stdout"]
  data_format = "influx"
