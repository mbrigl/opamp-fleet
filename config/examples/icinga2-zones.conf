/*
 * The topology half of a fleet-managed Icinga 2 Agent's configuration (ADR-0068): which node this
 * is, and which parent it talks to. Delivered as a Configuration named `icinga2-zones`, included
 * by name from `icinga2-conf`.
 *
 * `NodeName` is set by the Supervisor from the block's `node_name`, and is the common name the
 * certificate was issued for — so this file refers to it rather than repeating a host name that
 * could drift out of step with the certificate.
 */

object Endpoint NodeName { }

object Endpoint "master.example.com" {
  host = "master.example.com"
  port = "5665"
}

object Zone "master" {
  endpoints = [ "master.example.com" ]
}

// This Agent's own zone hangs below the master's: the parent sends its checks down into it.
object Zone NodeName {
  endpoints = [ NodeName ]
  parent = "master"
}

// The zone every Agent shares, which the ITL's global check commands are synchronised through.
object Zone "global-templates" {
  global = true
}
